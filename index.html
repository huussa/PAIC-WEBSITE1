<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAIC CLUB | Programming & Artificial Intelligence</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png"> 
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media.css">
</head>
<body>
    
    <header class="navbar">
        <div class="logo-container">
            <img src="assets/images/logo.png" alt="PAIC Club Logo" class="logo">
        </div>
        
        <button class="humburger-menu-icon" onclick="toggleHamburger(this)">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">About Us</a>
            <a href="#">Events</a>
            <a href="#">Contact</a>
            <div class="search-box">
                <input type="text" placeholder="Search...">
                <button type="submit">🔍</button>
            </div>
        </nav>
        

    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h1>PAIC CLUB</h1>
            <p class="subtitle">College of Computing and Information Technology | Taif University</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Programming & Artificial Intelligence Club. All Rights Reserved.</p>
    </footer>

    <script>
        function toggleHamburger(x) {
            x.classList.toggle("active");
            document.querySelector('.nav-links').classList.toggle('active');
        }
    </script>
    
    <script src="assets/js/script.js"></script>
</body>
</html>
